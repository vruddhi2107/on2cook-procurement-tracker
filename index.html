<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ProcureX — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/x-icon" href="on2cook no bg.png">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --red:        #ed1c24;
            --red-dark:   #c4141b;
            --red-muted:  rgba(237,28,36,0.06);
            --black:      #0a0a0c;
            --gray-1:     #121215;
            --gray-2:     #1c1c21;
            --gray-3:     #27272e;
            --gray-4:     #71717a;
            --gray-5:     #a1a1aa;
            --gray-6:     #e4e4e7;
            --white:      #ffffff;
            --off-white:  #f8f9fa;
            --border:     #e4e4e7;
            --font:       'Outfit', sans-serif;
            --mono:       'JetBrains Mono', monospace;
            --r-sm:       4px;
            --r:          8px;
            --r-lg:       12px;
            --ease:       cubic-bezier(0.16, 1, 0.3, 1);
        }

        html { font-size: 14px; }

        body {
            font-family: var(--font);
            background: var(--black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            color: var(--white);
        }

        /* ── Background Grid & Clean Accent Lines ── */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-grid {
            position: absolute;
            inset: -80px;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            animation: gridMove 40s linear infinite;
        }
        @keyframes gridMove { to { transform: translate(48px, 48px); } }

        /* Sleek subtle light accent spotlight instead of fuzzy pink blob */
        .bg-spotlight {
            position: absolute;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 500px;
            background: radial-gradient(ellipse at center, rgba(237, 28, 36, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .pt {
            position: absolute;
            width: 2px; height: 2px;
            border-radius: 50%;
            background: rgba(237, 28, 36, 0.4);
            animation: ptFloat linear infinite;
        }
        @keyframes ptFloat {
            0%   { transform: translateY(105vh); opacity: 0; }
            6%   { opacity: 1; }
            94%  { opacity: 0.35; }
            100% { transform: translateY(-5vh); opacity: 0; }
        }

        /* ── Scene ── */
        .scene {
            perspective: 1600px;
            z-index: 10;
            position: relative;
            animation: sceneEnter 0.65s var(--ease) both;
        }
        @keyframes sceneEnter {
            from { opacity: 0; transform: translateY(24px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card {
            width: 420px;
            transform-style: preserve-3d;
            transition: transform 0.8s var(--ease);
            position: relative;
        }
        .card.flipped { transform: rotateY(180deg); }

        .face {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 16px;
            overflow: hidden;
        }
        .back-face {
            position: absolute;
            inset: 0;
            transform: rotateY(180deg);
        }

        /* ────────── FRONT ────────── */
        .front-face {
            background: var(--gray-1);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 24px 64px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
            padding: 36px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .fl-logo {
            display: flex; align-items: center; gap: 10px;
        }
        .fl-mark {
            width: 34px; height: 34px;
            background: url("on2cook no bg.png") center/contain no-repeat;
            border-radius: var(--r);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .fl-name {
            font-weight: 800; font-size: 1.05rem; color: white; letter-spacing: -0.03em;
        }
        .fl-name span { color: var(--red); }

        /* Rings */
        .fl-rings {
            position: absolute;
            top: 28px; right: 28px;
            width: 70px; height: 70px;
            pointer-events: none;
        }
        .fl-ring {
            position: absolute; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .fl-ring:nth-child(1) { inset: 0; }
        .fl-ring:nth-child(2) { inset: 12px; border-color: rgba(237,28,36,0.2); }
        .fl-ring:nth-child(3) { inset: 24px; border-color: rgba(237,28,36,0.4); }

        /* Hero */
        .fl-hero { flex: 1; padding: 48px 0 36px; }
        .fl-eyebrow {
            font-family: var(--mono);
            font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
            color: var(--red); margin-bottom: 12px; font-weight: 600;
            display: flex; align-items: center; gap: 8px;
        }
        .fl-eyebrow::before { content: ''; width: 20px; height: 2px; background: var(--red); }
        .fl-h1 {
            font-size: 2.5rem; font-weight: 800; letter-spacing: -0.04em;
            line-height: 1.02; color: white;
        }
        .fl-h1 .r { color: var(--red); display: block; }
        .fl-desc {
            margin-top: 14px; font-size: 0.82rem;
            color: var(--gray-5); line-height: 1.5; max-width: 290px;
        }

        .fl-btn {
            width: 100%; padding: 13px;
            background: var(--red); border: none; border-radius: var(--r);
            color: white; font-family: var(--font); font-size: 0.88rem; font-weight: 700;
            letter-spacing: -0.01em; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.18s var(--ease);
        }
        .fl-btn:hover { background: var(--red-dark); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(237, 28, 36, 0.35); }
        .fl-btn:active { transform: translateY(0); }
        .arr { transition: transform 0.15s; }
        .fl-btn:hover .arr { transform: translateX(3px); }

        /* ────────── BACK ────────── */
        .back-face {
            background: var(--white);
            box-shadow: 0 24px 64px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            padding: 34px;
            color: var(--black);
        }

        .bk-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px;
        }
        .bk-logo { display: flex; align-items: center; gap: 8px; }
        .bk-mark {
            width: 28px; height: 28px;
            background: url("on2cook favicon.png") center/contain no-repeat;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
        }
        .bk-name { font-size: 0.95rem; font-weight: 800; color: var(--black); letter-spacing: -0.02em; }
        .bk-name span { color: var(--red); }

        .bk-back {
            width: 30px; height: 30px;
            background: var(--off-white); border: 1px solid var(--border);
            border-radius: var(--r-sm);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 0.75rem; color: var(--gray-4);
            transition: all 0.15s;
        }
        .bk-back:hover { background: var(--black); color: var(--white); border-color: var(--black); }

        .bk-title {
            font-size: 1.4rem; font-weight: 800; letter-spacing: -0.03em; color: var(--black); margin-bottom: 2px;
        }
        .bk-sub { font-size: 0.78rem; color: var(--gray-4); margin-bottom: 20px; }

        /* error */
        .bk-err {
            display: none; align-items: center; gap: 8px;
            background: rgba(237,28,36,0.08); border: 1px solid var(--red);
            color: var(--red-dark); padding: 9px 12px; border-radius: var(--r-sm);
            font-size: 0.78rem; font-weight: 600; margin-bottom: 14px;
        }
        .bk-err.on { display: flex; animation: errSlide 0.18s ease; }
        @keyframes errSlide {
            from { opacity: 0; transform: translateY(-5px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* fields */
        .fg { margin-bottom: 14px; }
        .lbl {
            display: block; font-family: var(--mono); font-size: 0.65rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.05em; color: var(--gray-4); margin-bottom: 6px;
        }
        .iw { position: relative; }
        .ii {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            font-size: 0.8rem; color: var(--gray-4); pointer-events: none; transition: color 0.15s;
        }
        .fc {
            width: 100%; padding: 10px 12px 10px 36px;
            border: 1px solid var(--border); border-radius: var(--r-sm);
            font-family: var(--font); font-size: 0.85rem; color: var(--black);
            background: var(--white); outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            letter-spacing: -0.01em;
        }
        .fc:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(237,28,36,0.12); }
        .fc:focus ~ .ii { color: var(--red); }

        .fgt {
            display: block; text-align: right; margin-top: 6px;
            font-size: 0.72rem; font-weight: 600; color: var(--red); text-decoration: none;
        }
        .fgt:hover { text-decoration: underline; }

        .sub-btn {
            width: 100%; margin-top: 10px; padding: 12px;
            background: var(--red); border: none; border-radius: var(--r-sm);
            color: white; font-family: var(--font); font-size: 0.88rem; font-weight: 700;
            letter-spacing: -0.01em; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.15s; position: relative; overflow: hidden;
        }
        .sub-btn:hover { background: var(--red-dark); box-shadow: 0 4px 14px rgba(237,28,36,0.3); }
        .sub-btn:disabled { opacity: 0.65; cursor: not-allowed; }

        .bk-foot {
            margin-top: auto; padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .bk-copy { font-family: var(--mono); font-size: 0.62rem; color: var(--gray-4); }
        .bk-links { display: flex; gap: 12px; }
        .bk-links a { font-family: var(--mono); font-size: 0.62rem; color: var(--gray-4); text-decoration: none; }
        .bk-links a:hover { color: var(--red); }
    </style>
</head>
<body>

<!-- Background Grid & Spotlight -->
<div class="bg">
    <div class="bg-grid"></div>
    <div class="bg-spotlight"></div>
</div>

<div class="scene">
    <div class="card" id="card">

        <!-- FRONT -->
        <div class="face front-face">
            <div class="fl-rings">
                <div class="fl-ring"></div>
                <div class="fl-ring"></div>
                <div class="fl-ring"></div>
            </div>

            <div class="fl-logo">
                <div class="fl-mark"></div>
                <div class="fl-name">Procure<span>X</span></div>
            </div>

            <div class="fl-hero">
                <p class="fl-eyebrow">Procurement Tracker</p>
                <h1 class="fl-h1">
                    Modernize<br/>your
                    <span class="r">supply chain.</span>
                </h1>
                <p class="fl-desc">End-to-end procurement intelligence system</p>
            </div>

            <button class="fl-btn" onclick="flip()">
                Sign In to Dashboard
                <i class="fas fa-arrow-right arr"></i>
            </button>
        </div>

        <!-- BACK -->
        <div class="face back-face">
            <div class="bk-header">
                <div class="bk-logo">
                    <div class="bk-mark"></div>
                    <div class="bk-name">Procure<span>X</span></div>
                </div>
                <button class="bk-back" onclick="flip()" aria-label="Back">
                    <i class="fas fa-arrow-left"></i>
                </button>
            </div>

            <h2 class="bk-title">Welcome back</h2>
            <p class="bk-sub">Enter your credentials to continue.</p>

            <div id="loginError" class="bk-err">
                <i class="fas fa-circle-exclamation"></i>
                <span>Invalid email or password.</span>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="fg">
                    <label class="lbl" for="email">Email Address</label>
                    <div class="iw">
                        <input type="email" id="email" class="fc" placeholder="name@company.com" required />
                        <i class="fas fa-envelope ii"></i>
                    </div>
                </div>

                <div class="fg">
                    <label class="lbl" for="password">Password</label>
                    <div class="iw">
                        <input type="password" id="password" class="fc" placeholder="••••••••" required />
                        <i class="fas fa-lock ii"></i>
                    </div>
                    <a href="pages/change-password.html" class="fgt">Forgot password?</a>
                </div>

                <button type="submit" class="sub-btn" id="loginBtn">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right arr"></i>
                </button>
            </form>

            <div class="bk-foot">
                <span class="bk-copy">&copy; 2026 Invent India</span>
                <div class="bk-links">
                    <a href="#">Privacy</a>
                    <a href="#">Support</a>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>

<script>
    /* background particles */
    const bg = document.querySelector('.bg');
    for (let i = 0; i < 18; i++) {
        const d = document.createElement('div');
        d.className = 'pt';
        d.style.cssText = `left:${Math.random()*100}%;width:${1.5+Math.random()*1.5}px;height:${1.5+Math.random()*1.5}px;animation-duration:${12+Math.random()*15}s;animation-delay:-${Math.random()*20}s`;
        bg.appendChild(d);
    }

    function flip() { document.getElementById('card').classList.toggle('flipped'); }

    if (typeof Session !== 'undefined') {
        const s = Session.get();
        if (s) redirectByRole(s.role);
    }

    async function handleLogin(e) {
        e.preventDefault();
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn      = document.getElementById('loginBtn');
        const err      = document.getElementById('loginError');

        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Signing in…</span>';
        btn.disabled  = true;
        err.classList.remove('on');

        try {
            const { data, error } = await db
                .from('users').select('*')
                .eq('email', email).eq('password', password).single();

            if (error || !data) {
                err.classList.add('on');
                btn.innerHTML = '<span>Sign In</span><i class="fas fa-arrow-right arr"></i>';
                btn.disabled  = false;
                return;
            }
            Session.set(data);
            redirectByRole(data.role);
        } catch {
            err.querySelector('span').textContent = 'Connection error.';
            err.classList.add('on');
            btn.innerHTML = '<span>Sign In</span><i class="fas fa-arrow-right arr"></i>';
            btn.disabled  = false;
        }
    }

    function redirectByRole(role) {
        const r = {
            director: 'pages/master.html',
            master: 'pages/master.html',
            procurement_manager: 'pages/procurement.html',
            engineer: 'pages/engineer.html',
            project_manager: 'pages/pm.html',
            accounts: 'pages/accounts.html',
            store_manager: 'pages/store.html',
            qc_inspector: 'pages/qc.html'
        };
        window.location.href = r[role] || 'pages/engineer.html';
    }
</script>
</body>
</html>
